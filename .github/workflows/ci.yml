name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  # Required for the merge queue: queued PRs are tested as a merge group.
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: praise_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost:5432/praise_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
        env:
          TEST_BROWSER: "1"
          TEST_AUTH_HTTP: "1"
          CHROMIUM_PATH: playwright

  # Build both images on every PR (push: false, so a broken Dockerfile fails
  # review). On master and version tags, push sha-/latest/semver tags only
  # after `verify` succeeds.
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            file: Dockerfile.web
          - name: worker
            file: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker image names must be lowercase, and the owner (PraiseLoop) is not.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Redeploy the dev stack once master's images are published. A plain GitHub push
  # webhook would fire before `images` finishes and Dockhand would pull the previous
  # `latest`, so CI sends the same signed push event itself, after the push. Skipped
  # (with a notice) when the secrets are not set, e.g. on forks.
  deploy-dev:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Trigger the Dockhand dev stack
        env:
          WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "::notice::DOCKHAND_WEBHOOK_URL or DOCKHAND_WEBHOOK_SECRET is not set; skipping the dev deploy."
            exit 0
          fi
          payload=$(jq -cn \
            --arg ref "$GITHUB_REF" \
            --arg after "$GITHUB_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            '{ref: $ref, after: $after, repository: {full_name: $repo, html_url: $url, clone_url: ($url + ".git")}}')
          signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.*= //')
          status=$(curl -sS -o response.txt -w '%{http_code}' --max-time 60 -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data-binary "$payload")
          echo "Dockhand responded with HTTP $status"
          head -c 500 response.txt; echo
          case "$status" in
            2??) ;;
            *) echo "::error::Dockhand webhook returned HTTP $status"; exit 1 ;;
          esac

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
