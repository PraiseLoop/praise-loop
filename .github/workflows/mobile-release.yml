name: Android release

# Builds a standalone Android APK in EAS and attaches it to a GitHub Release, so a phone running
# Obtainium can install it and pick up updates. Runs only when a tag like mobile-v1.0.1 is pushed
# (or by hand), never on ordinary pushes. Setup: docs/android-release.md.
on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install app dependencies
        working-directory: mobile
        run: npm ci

      - name: Check before building
        working-directory: mobile
        run: |
          npm run typecheck
          npm test

      - name: Build the APK in EAS
        working-directory: mobile
        env:
          # The app config reads the project id from this variable, and EAS needs it before it can
          # look anything else up (including the environment variables stored in the project).
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
        run: |
          if [ -z "$EXPO_PUBLIC_EAS_PROJECT_ID" ]; then
            echo "Set the repository variable EAS_PROJECT_ID (docs/android-release.md)" >&2
            exit 1
          fi
          eas build --platform android --profile preview --non-interactive --wait --json > "$RUNNER_TEMP/build.json"

      - name: Download the APK
        id: apk
        run: |
          url=$(jq -r '.[0].artifacts.buildUrl // empty' "$RUNNER_TEMP/build.json")
          if [ -z "$url" ]; then echo "EAS did not return an APK link" >&2; cat "$RUNNER_TEMP/build.json" >&2; exit 1; fi
          # A branch name can contain "/" (feature/x); keep the file name to safe characters.
          safe=$(printf '%s' "${GITHUB_REF_NAME:-manual}" | tr -c 'A-Za-z0-9._-' '-')
          name="praiseloop-${safe}.apk"
          curl --fail --location --silent --show-error --output "$name" "$url"
          echo "file=$name" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "PraiseLoop Android $GITHUB_REF_NAME" \
            --generate-notes

      - name: Keep the APK from a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/mobile-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.file }}
